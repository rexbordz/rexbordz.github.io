<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Preview Stub</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: 'Inter', sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #params {
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 16px 20px;
      max-width: 80%;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #alert {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1c1c1c;
      border: 1px solid #3b82f6;
      border-radius: 10px;
      padding: 12px 18px;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    #alert.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="params"></div>
  <div id="alert"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const entries = [...params.entries()];
    document.getElementById('params').textContent = entries.length
      ? entries.map(([k, v]) => `${k} = ${v}`).join('\n')
      : '(no params yet — settings panel updates this live)';

    window.addEventListener('message', (event) => {
      if (!event.data || event.data.type !== 'testAlert') return;
      const alertBox = document.getElementById('alert');
      const data = event.data.data || {};
      alertBox.textContent = `${data.username || 'User'}: ${data.message || ''}`;
      alertBox.classList.add('show');
      setTimeout(() => alertBox.classList.remove('show'), 3000);
    });
  </script>
</body>
</html>
